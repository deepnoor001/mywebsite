<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indian Road Run - Made by Damandeep</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#222;
font-family:sans-serif;
}

#ui-layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.6);
z-index:100;
}

#menu-container{
background:#222;
padding:20px;
border-radius:15px;
border:4px solid white;
text-align:center;
width:85%;
max-width:500px;
}

.nav-btn{
padding:15px;
margin-top:10px;
width:100%;
font-size:18px;
background:#27ae60;
border:3px solid white;
color:white;
cursor:pointer;
}

.nav-btn.back{
background:#c0392b;
}

.menu-step{display:none;}
.menu-step.active{display:block;}

#hud{
position:absolute;
top:10px;
left:10px;
right:10px;
display:none;
justify-content:space-between;
color:white;
font-size:24px;
z-index:50;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="hud">
<div id="score-text">Score:0</div>
<div id="target-text">Goal:0</div>
</div>

<div id="ui-layer">

<div id="menu-container">

<div id="step-1" class="menu-step active">

<h1>INDIAN ROAD RUN</h1>

<button class="nav-btn" onclick="goToStep(2)">
PLAY
</button>

</div>


<!-- END SCREEN -->
<div id="step-end" class="menu-step">

<h1 id="end-title">FINISHED</h1>

<p id="end-msg">Score</p>

<!-- ✅ PLAY AGAIN ADDED -->
<button class="nav-btn" onclick="playAgain()">
PLAY AGAIN
</button>

<button class="nav-btn back" onclick="goToStep(1)">
MAIN MENU
</button>

</div>

</div>
</div>
